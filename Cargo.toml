[workspace]
resolver = "3"
members = ["crates/engine", "crates/mapc", "crates/rt", "crates/hellbyte"]
default-members = ["crates/hellbyte"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
panic = "abort"
opt-level = 1

# Build scripts do real work (texture generation, BSP building): optimise them.
[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2
