# Linux targets link with rust-lld, no libc, fully static (see crates/hellbyte/build.rs).
# SPARC, m68k and C-SKY use GNU ld via scripts/linker (rust-lld has no backend for them).
# Build with:  cargo build --release --target <triple>   (tier-3 triples need nightly + -Z build-std=core)

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "relocation-model=static", "-C", "link-self-contained=no", "-C", "link-arg=-nostdlib", "-C", "link-arg=-static", "-C", "link-arg=--entry=_start"]

[target.i686-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "relocation-model=static", "-C", "link-self-contained=no", "-C", "link-arg=-nostdlib", "-C", "link-arg=-static", "-C", "link-arg=--entry=_start"]

