# Windows: no C runtime; Win32 imported via raw-dylib; linked by rust-lld.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link", "-C", "link-arg=/ENTRY:WinMainCRTStartup", "-C", "link-arg=/SUBSYSTEM:WINDOWS,5.02", "-C", "link-arg=/NODEFAULTLIB", "-C", "link-arg=/STACK:1048576,1048576"]

[target.i686-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link", "-C", "link-arg=/ENTRY:WinMainCRTStartup", "-C", "link-arg=/SUBSYSTEM:WINDOWS,5.01", "-C", "link-arg=/NODEFAULTLIB", "-C", "link-arg=/STACK:1048576,1048576", "-C", "link-arg=/SAFESEH:NO"]

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link", "-C", "link-arg=/ENTRY:WinMainCRTStartup", "-C", "link-arg=/SUBSYSTEM:WINDOWS,6.02", "-C", "link-arg=/NODEFAULTLIB", "-C", "link-arg=/STACK:1048576,1048576"]

# macOS: links only libSystem (via crates/hellbyte/macos/libSystem.tbd) with
# rust-lld's Mach-O linker; Cocoa is loaded at run time with dlopen.
[target.aarch64-apple-darwin]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld64.lld", "-C", "link-arg=-dead_strip"]

[target.x86_64-apple-darwin]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld64.lld", "-C", "link-arg=-dead_strip"]
